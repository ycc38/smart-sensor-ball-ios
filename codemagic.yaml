workflows:
  ios-compatibility-check:
    name: iOS 15 compatibility check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        MIN_IOS: "15.0"
    scripts:
      - name: Run iOS compatibility checks
        script: scripts/check_ios_compatibility.sh
    artifacts:
      - build/compatibility/**

  ios-simulator-check:
    name: iOS simulator compile check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build without signing for simulator
        script: |
          xcodebuild clean build \
            -project "SmartSensorBall.xcodeproj" \
            -scheme "SmartSensorBall" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

  ios-signed-ipa:
    name: iOS signed IPA - App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic App Store Connect
    environment:
      xcode: latest
      groups:
        - code-signing
      vars:
        BUNDLE_ID: com.zclei.smartsensorball
        APP_STORE_APPLE_ID: "6770832460"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Initialize keychain
        script: keychain initialize
      - name: Fetch or create App Store signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificates to keychain
        script: keychain add-certificates
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles --project "SmartSensorBall.xcodeproj"
      - name: Set unique App Store build number
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          case "$LATEST_BUILD_NUMBER" in
            ""|*[!0-9]*)
              echo "Could not determine the latest App Store build number: $LATEST_BUILD_NUMBER"
              exit 1
              ;;
          esac
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          echo "Using App Store build number $NEXT_BUILD_NUMBER"
      - name: Build signed IPA
        script: xcode-project build-ipa --project "SmartSensorBall.xcodeproj" --scheme "SmartSensorBall"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
